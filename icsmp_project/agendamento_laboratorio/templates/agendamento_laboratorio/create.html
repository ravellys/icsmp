{% extends 'base/base.html' %}
{% load static %}
{% load bootstrap %}
{% block title %}Agendamento Laboratório{% endblock title %}

{% block body %}
    <div class="container justify-content-start text-white m-4">
        <h1 class="text-white">Envie seu Agendamento no Formulário Abaixo</h1>
        <div>
            <form action="." method="POST">
                {% csrf_token %}
                {{ form|bootstrap }}
                <input type="submit" class="btn btn-light mb-4" value="Agendar Horário">
            </form>

        </div>
    </div>
    <script type="text/javascript">
        document.getElementById('id_data_solicitacao').type = 'datetime-local'
    </script>
{% endblock %}
